<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPEX Admin — Design Prototype</title>
  <link rel="icon" href="assets/favicon.png" />
